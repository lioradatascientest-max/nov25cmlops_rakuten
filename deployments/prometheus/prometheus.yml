global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "rakuten-fastapi"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "gateway:8000"
          - "api-predict:8000"
          - "api-ingest:8000"
          - "api-train:8000"
          - "api-monitor:8000"

  - job_name: "rakuten-nginx-exporter"
    static_configs:
      - targets: ["rakuten-nginx-exporter:9113"]

  - job_name: "rakuten-node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
