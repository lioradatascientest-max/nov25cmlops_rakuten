name: CI/CD MLOps Rakuten

on:
  push:
    branches: 
      - development-sb
  pull_request:
    branches: 
      - development-sb

jobs:
  # PREMIER JOB : Les Tests - repo liora - dagshub liora v1
  test-suite:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: DVC Pull
        run: |
          python -m dvc remote modify origin auth basic
          python -m dvc remote modify origin user lioradatascientest
          python -m dvc remote modify origin password ${{ secrets.DAGSHUB_TOKEN }}
          python -m dvc pull

      - name: Create missing directories and dummy data
        run: |
          mkdir -p data/processed data/raw data/interim logs models
          mkdir -p data/processed/2024-01-01_00-00-00
          mkdir -p models/2024-01-01_00-00-00
          touch models/2024-01-01_00-00-00/text_classifier.pkl
          touch models/text_classifier.pkl

      - name: Run all tests
        run: |
          pytest tests/

  # DEUXIÈME JOB : Build & Push Docker
  build-and-push-docker:
    needs: test-suite # IMPORTANT : N'exécute ce job que si 'test-suite' est réussi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Vous devez créer ces secrets dans les paramètres GitHub de Julien
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Remplacez 'votre_pseudo_docker' par votre vrai pseudo Docker Hub
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rakuten-api:latest
            ${{ secrets.DOCKER_USERNAME }}/rakuten-api:${{ github.sha }}