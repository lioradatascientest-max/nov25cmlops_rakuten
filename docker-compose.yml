# docker-compose.yml - Rakuten MLOps Full Stack
#
# Deux modes d'exécution via EXECUTION_MODE :
#   EXECUTION_MODE=cli    → subprocess dans le container (pas de dvc/git runner)
#   EXECUTION_MODE=docker → docker exec vers dvc-runner / git-runner (défaut actuel)
#
# Usage :
#   make docker-up-cli     → EXECUTION_MODE=cli    (sans dvc/git runner)
#   make docker-up-docker  → EXECUTION_MODE=docker (avec dvc/git runner)

services:
  # ============================================================================
  # API Gateway (Main Entry Point) — toujours présent
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-gateway
    command: ["uvicorn", "mlops_rakuten.services.gateway_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - rakuten_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # nécessaire en mode docker uniquement pour appeler les containers entre eux.
    networks: [rakuten-net]
    restart: unless-stopped
    depends_on:
      api-predict:
        condition: service_healthy
      api-ingest:
        condition: service_healthy
      api-train:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - PYTHONUNBUFFERED=1
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
    env_file: .env

  # ============================================================================
  # API: Data Ingestion — toujours présent
  # ============================================================================
  api-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-ingest
    command: ["uvicorn", "mlops_rakuten.services.ingest_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
      - rakuten_logs:/app/logs
      - rakuten_dvc_cache:/app/.dvc/cache
      - ~/.ssh:/root/.ssh
      # docker.sock monté conditionnellement via la variable — toujours présent
      # mais utilisé seulement si EXECUTION_MODE=docker
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
    env_file: .env

  # ============================================================================
  # API: Model Training — toujours présent
  # ============================================================================
  api-train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-train
    command: ["uvicorn", "mlops_rakuten.services.train_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
      - rakuten_models:/app/models
      - rakuten_reports:/app/reports
      - rakuten_logs:/app/logs
      - rakuten_dvc_cache:/app/.dvc/cache
      - ~/.ssh:/root/.ssh
      - /var/run/docker.sock:/var/run/docker.sock # nécessaire en mode docker uniquement pour appeler les containers entre eux.
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    environment:
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
    env_file: .env

  # ============================================================================
  # API: Model Prediction — toujours présent
  # ============================================================================
  api-predict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-predict
    command: ["uvicorn", "mlops_rakuten.services.predict_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
      - rakuten_models:/app/models
      - rakuten_reports:/app/reports
      - rakuten_logs:/app/logs
      - rakuten_dvc_cache:/app/.dvc/cache
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
    env_file: .env

  # ============================================================================
  # DVC Runner — profil docker uniquement
  # ============================================================================
  dvc-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-dvc-runner
    working_dir: /app
    command: ["sleep", "infinity"]
    profiles: ["docker"]                    # actif seulement avec --profile docker
    volumes:
      - .:/app
      - rakuten_dvc_cache:/app/.dvc/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh
    networks: [rakuten-net]
    restart: "no"
    environment:
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
    env_file: .env
    stdin_open: true
    tty: true

  # ============================================================================
  # Git Runner — profil docker uniquement
  # ============================================================================
  git-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-git-runner
    working_dir: /app
    command: ["sleep", "infinity"]
    profiles: ["docker"]                    #actif seulement avec --profile docker
    volumes:
      - .:/app
      - rakuten_dvc_cache:/app/.dvc/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh
    networks: [rakuten-net]
    restart: "no"
    environment:
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
    env_file: .env
    stdin_open: true
    tty: true

  # ============================================================================
  # Nginx — toujours présent
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: rakuten-nginx
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/certs:/etc/nginx/certs:ro
    networks: [rakuten-net]
    restart: unless-stopped

  # ============================================================================
  # Monitoring — toujours présent
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rakuten-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rakuten_prometheus_data:/prometheus
    networks: [rakuten-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: rakuten-grafana
    ports:
      - "3000:3000"
    volumes:
      - rakuten_grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks: [rakuten-net]
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  rakuten_models:
    name: rakuten_models
  rakuten_reports:
    name: rakuten_reports
  rakuten_dvc_cache:
    name: rakuten_dvc_cache
  rakuten_logs:
    name: rakuten_logs
  rakuten_prometheus_data:
    name: rakuten_prometheus_data
  rakuten_grafana_data:
    name: rakuten_grafana_data

# ============================================================================
# Networks
# ============================================================================
networks:
  rakuten-net:
    driver: bridge