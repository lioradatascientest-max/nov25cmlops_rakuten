# docker-compose.yml - Rakuten MLOps Full Stack
#
# Trois modes d'exécution :
#   make docker-up-cli     → EXECUTION_MODE=cli    (sans runners, sans airflow)
#   make docker-up-docker  → EXECUTION_MODE=docker (avec dvc/git runners, sans airflow)
#   make docker-up-airflow → EXECUTION_MODE=cli (avec airflow CeleryExecutor)

# ============================================================================
# Airflow — configuration commune 
# ============================================================================
x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.9.0}
  profiles: ["airflow"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKEND: "airflow.api.auth.backend.basic_auth"
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-docker"
    # Variables injectées dans le dag
    DAGSHUB_USER: ${DAGSHUB_USER}
    DAGSHUB_REPO: ${DAGSHUB_REPO}
    DAGSHUB_TOKEN: ${DAGSHUB_TOKEN}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME}
    MLFLOW_TRACKING_PASSWORD: ${DAGSHUB_TOKEN}
    GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME}
    GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL}
    EXECUTION_MODE: docker
  volumes:
    - ./dags:/opt/airflow/dags
    - rakuten_airflow_logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock   # DockerOperator
    - ~/.ssh:/root/.ssh
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-1001}"
  depends_on: &airflow-common-depends
    airflow-postgres:
      condition: service_healthy
    airflow-redis:
      condition: service_healthy
  networks: [rakuten-net]

services:
  # ============================================================================
  # API Gateway — toujours présent
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-gateway
    command: ["uvicorn", "mlops_rakuten.services.gateway_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - rakuten_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [rakuten-net]
    restart: unless-stopped
    depends_on:
     # api-predict:
      #  condition: service_healthy
      api-ingest:
        condition: service_healthy
      api-train:
        condition: service_healthy
      api-monitor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - PYTHONUNBUFFERED=1
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
    env_file: .env

  # ============================================================================
  # Data Ingestion — toujours présent
  # ============================================================================
  api-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-ingest
    command: ["uvicorn", "mlops_rakuten.services.ingest_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
      - rakuten_logs:/app/logs
      - rakuten_dvc_cache:/app/.dvc/cache
      - ~/.ssh:/root/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
      - GITHUB_USER=${GITHUB_USER}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    env_file: .env

  # ============================================================================
  # Model Training — toujours présent
  # ============================================================================
  api-train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-train
    command: ["uvicorn", "mlops_rakuten.services.train_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
      - rakuten_models:/app/models
      - rakuten_reports:/app/reports
      - rakuten_logs:/app/logs
      - rakuten_dvc_cache:/app/.dvc/cache
      - ~/.ssh:/root/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    environment:
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
      - GITHUB_USER=${GITHUB_USER}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
    env_file: .env

  # ============================================================================
  # Model Prediction — toujours présent
  # ============================================================================
  api-predict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-predict
    command: ["uvicorn", "mlops_rakuten.services.predict_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
      - rakuten_models:/app/models
      - rakuten_reports:/app/reports
      - rakuten_logs:/app/logs
      - rakuten_dvc_cache:/app/.dvc/cache
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - EXECUTION_MODE=${EXECUTION_MODE:-docker}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    env_file: .env

    # ============================================================================
  # Evidently - drift monitoring - Toujours présent
  # ============================================================================
  api-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-monitor
    command: ["uvicorn", "mlops_rakuten.services.monitor_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app                          # accès à data/interim, data/uploads, data/raw
      - rakuten_reports:/app/reports    # rapport HTML partagé avec Streamlit
      - rakuten_logs:/app/logs
      - rakuten_models:/app/models
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - REFERENCE_CSV=/app/data/interim/rakuten_train.csv
      - UPLOADS_DIR=/app/data/raw/uploads
      - SEEDS_DIR=/app/data/raw/rakuten/seeds
      - MODELS_DIR=/app/models
      - REPORT_PATH=/app/reports/drift/drift_report.html
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    env_file: .env

  # ============================================================================
  # DVC Runner — profil docker uniquement
  # ============================================================================
  dvc-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-dvc-runner
    working_dir: /app
    command: ["sleep", "infinity"]
    profiles: ["docker"]
    volumes:
      - .:/app
      - rakuten_dvc_cache:/app/.dvc/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh
    networks: [rakuten-net]
    restart: "no"
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${DAGSHUB_TOKEN}
    env_file: .env
    stdin_open: true
    tty: true

  # ============================================================================
  # Git Runner — profil docker uniquement
  # ============================================================================
  git-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-git-runner
    working_dir: /app
    command: ["sleep", "infinity"]
    profiles: ["docker"]
    volumes:
      - .:/app
      - rakuten_dvc_cache:/app/.dvc/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh
    networks: [rakuten-net]
    restart: "no"
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_github -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    env_file: .env
    stdin_open: true
    tty: true

  # ============================================================================
  # Nginx — toujours présent
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: rakuten-nginx
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/certs:/etc/nginx/certs:ro
    networks: [rakuten-net]
    restart: unless-stopped

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: rakuten-nginx-exporter
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    environment:
      SCRAPE_URI: https://nginx/nginx_status
    networks:
      - rakuten-net
    restart: unless-stopped

  # ============================================================================
  # Monitoring — toujours présent
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rakuten-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rakuten_prometheus_data:/prometheus
    networks: [rakuten-net]
    depends_on:
      - nginx_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: rakuten-grafana
    ports:
      - "3000:3000"
    volumes:
      - rakuten_grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks: [rakuten-net]
    restart: unless-stopped

  # ============================================================================
  # Airflow — profil airflow 
  # ============================================================================

  airflow-postgres:
    image: postgres:13
    profiles: ["airflow"]
    container_name: rakuten-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - rakuten_airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks: [rakuten-net]
    restart: unless-stopped

  airflow-redis:
    image: redis:latest
    profiles: ["airflow"]
    container_name: rakuten-airflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    networks: [rakuten-net]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: rakuten-airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  airflow-webserver:
    <<: *airflow-common
    container_name: rakuten-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: rakuten-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: rakuten-airflow-worker
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-flower:
    <<: *airflow-common
    container_name: rakuten-airflow-flower
    command: celery flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped


# ============================================================================
# Volumes
# ============================================================================
volumes:
  rakuten_models:
    name: rakuten_models
  rakuten_reports:
    name: rakuten_reports
  rakuten_dvc_cache:
    name: rakuten_dvc_cache
  rakuten_logs:
    name: rakuten_logs
  rakuten_prometheus_data:
    name: rakuten_prometheus_data
  rakuten_grafana_data:
    name: rakuten_grafana_data
  rakuten_airflow_db:
    name: rakuten_airflow_db
  rakuten_airflow_logs:
    name: rakuten_airflow_logs

# ============================================================================
# Networks
# ============================================================================
networks:
  rakuten-net:
    driver: bridge